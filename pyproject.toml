[project]
name = "neptuno-smartbeach"
version = "1.0.0"
description = "NEPTUNO - Smart Coastal Intelligence Platform for A Coruna beaches"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Nicolas Aller"},
]
dependencies = [
    "fastapi[standard]>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "onnxruntime>=1.17.0",
    "Pillow>=10.0.0",
    "joblib>=1.3.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
