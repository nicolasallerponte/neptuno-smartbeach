version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # MongoDB -- persistent store for Orion-LD and IoT Agent
  # ---------------------------------------------------------------------------
  mongo-db:
    image: mongo:5.0
    hostname: mongo-db
    container_name: neptuno-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - neptuno
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Orion-LD Context Broker -- NGSI-LD API on port 1026
  # ---------------------------------------------------------------------------
  orion:
    image: fiware/orion-ld:1.5.1
    hostname: orion
    container_name: neptuno-orion
    restart: unless-stopped
    depends_on:
      mongo-db:
        condition: service_healthy
    ports:
      - "1026:1026"
    networks:
      - neptuno
    command: -dbhost mongo-db -logLevel WARN -forwarding
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1026/version"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # IoT Agent JSON -- HTTP transport, NGSI-LD mode
  # ---------------------------------------------------------------------------
  iot-agent:
    image: fiware/iotagent-json:3.4.0
    hostname: iot-agent
    container_name: neptuno-iot-agent
    restart: unless-stopped
    depends_on:
      orion:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    ports:
      - "4041:4041"
      - "7896:7896"
    networks:
      - neptuno
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_NORTH_PORT=4041
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_LOG_LEVEL=DEBUG
      - IOTA_TIMESTAMP=true
      - IOTA_CB_NGSI_VERSION=ld
      - IOTA_JSON_LD_CONTEXT=http://context/user-context.jsonld
      - IOTA_FALLBACK_TENANT=smartbeach
      - IOTA_FALLBACK_PATH=/
      - IOTA_MONGO_HOST=mongo-db
      - IOTA_MONGO_PORT=27017
      - IOTA_MONGO_DB=iotagent-json
      - IOTA_HTTP_PORT=7896
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      - IOTA_DEFAULT_RESOURCE=/iot/json
      - IOTA_AUTOCAST=true

  # ---------------------------------------------------------------------------
  # CrateDB -- time-series store for QuantumLeap
  # ---------------------------------------------------------------------------
  crate-db:
    image: crate:5.6.4
    hostname: crate-db
    container_name: neptuno-crate
    restart: unless-stopped
    ports:
      - "4200:4200"
      - "4300:4300"
    networks:
      - neptuno
    volumes:
      - crate-data:/data
    command: >
      crate
      -Cauth.host_based.enabled=false
      -Ccluster.name=neptuno
      -Chttp.cors.enabled=true
      -Chttp.cors.allow-origin="*"
    environment:
      - CRATE_HEAP_SIZE=1g

  # ---------------------------------------------------------------------------
  # QuantumLeap -- NGSI-LD to CrateDB time-series persistence
  # ---------------------------------------------------------------------------
  quantumleap:
    image: orchestracities/quantumleap:1.0.0
    hostname: quantumleap
    container_name: neptuno-quantumleap
    restart: unless-stopped
    depends_on:
      - crate-db
      - orion
    ports:
      - "8668:8668"
    networks:
      - neptuno
    environment:
      - CRATE_HOST=crate-db
      - CRATE_PORT=4200
      - USE_GEOCODING=false
      - LOGLEVEL=DEBUG
      - CACHE_QUERIES=true

  # ---------------------------------------------------------------------------
  # Grafana -- dashboards connected to CrateDB via PostgreSQL wire protocol
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.0.4
    hostname: grafana
    container_name: neptuno-grafana
    restart: unless-stopped
    depends_on:
      - crate-db
    ports:
      - "3003:3000"
    networks:
      - neptuno
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-neptuno2026}
      - GF_SERVER_ROOT_URL=http://localhost:3003

  # ---------------------------------------------------------------------------
  # Context Server -- nginx serving NGSI-LD JSON-LD context files
  # ---------------------------------------------------------------------------
  context:
    image: nginx:alpine
    hostname: context
    container_name: neptuno-context
    restart: unless-stopped
    ports:
      - "3004:80"
    networks:
      - neptuno
    volumes:
      - ./context:/usr/share/nginx/html:ro
      - ./context/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  neptuno:
    driver: bridge

volumes:
  mongo-data:
  crate-data:
  grafana-data:
